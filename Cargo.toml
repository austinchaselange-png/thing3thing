[workspace]
resolver = "2"
members = ["crates/things-cloud", "crates/things-sync", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
